<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TowerBlock</title>
<link rel="stylesheet" href="tower-style.css" />
</head>
<body>

  <div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
      <div class="logo-spinner"></div>
      <span class="logo-text">TowerBlock</span>
    </div>
  </div>

  <div id="container">
    <button id="closeGameBtn" title="Закрыть игру">✕</button>
    <div id="pointsCounter" class="points-counter">🏆 <span id="pointsVal">0</span>/500</div>
    <div id="gameClickLayer" class="game-click-layer"></div>
    <div id="game"></div>
    <div id="score">0</div>
    <div class="game-over">
      <h2>Игра окончена!</h2>
      <p id="scoreSummary" class="go-score">Счёт: 0</p>

      <div class="go-panel">
        <button id="continueBtn" class="go-btn go-btn--primary">Продолжить · 1 💎</button>
        <div class="go-points-row">
          <button id="takePointsBtn" class="go-btn go-btn--ghost">Забрать 🏆</button>
          <button id="doublePointsBtn" class="go-btn go-btn--accent">×2 за рекламу</button>
        </div>
      </div>

      <p class="go-hint">Нажмите на экран, чтобы начать заново</p>
    </div>
    <div class="game-ready">
      <div id="start-button">Построй свою башню!</div>
      <p class="points-hint">За 500 очков можно открыть любой тест для разового прохождения. Очки за игру начисляются, если счёт выше 10, и суммируются между играми.</p>
    </div>
  </div>

  <script src="./three_min.js"></script>
  <script src="./TweenMax_min.js"></script>
  <script src="./tower-game.js"></script>
  <script>
    // Скрываем загрузочный экран сразу после инициализации сцены
    window.addEventListener("load", () => {
      setTimeout(() => {
        const ls = document.getElementById("loadingScreen");
        if (ls) { ls.style.opacity = "0"; setTimeout(() => ls.style.display = "none", 500); }
      }, 300);
    });

    // Стартовое значение накопленных очков приходит от родительского приложения через ?points=
    (function initPoints(){
      const params = new URLSearchParams(window.location.search);
      const start = parseInt(params.get("points"), 10);
      document.getElementById("pointsVal").textContent = Number.isFinite(start) ? start : 0;
    })();

    // Родитель может прислать актуальный тотал очков (например, сразу после начисления)
    // и результат запроса на продолжение игры за алмаз
    window.addEventListener("message", (e) => {
      const data = e.data || {};
      if (data.type === "towerbloxx:pointsUpdate" && typeof data.total === "number") {
        document.getElementById("pointsVal").textContent = data.total;
      }
      if (data.type === "towerbloxx:continueResult") {
        const btn = document.getElementById("continueBtn");
        btn.disabled = false;
        btn.textContent = "Продолжить · 1 💎";
        if (data.ok && window.game && window.game.continueAfterLoss) {
          window.game.continueAfterLoss();
        }
        // при ok:false родитель сам покажет предупреждение о нехватке
        // алмазов - тут просто возвращаем кнопку в исходное состояние
      }
      if (data.type === "towerbloxx:pointsResult") {
        const takeBtn = document.getElementById("takePointsBtn");
        const doubleBtn = document.getElementById("doublePointsBtn");
        if (data.ok) {
          takeBtn.textContent = `Забрано: ${data.credited} 🏆`;
          doubleBtn.textContent = "×2 за рекламу";
        } else {
          takeBtn.disabled = false;
          doubleBtn.disabled = earnedPointsThisRound < 10;
        }
      }
    });

    document.getElementById("continueBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = "Списываем 💎…";
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "towerbloxx:continueRequest" }, "*");
        }
      } catch (err) {}
    });

    // Счёт текущего проигрыша - обновляется при каждом завершении игры,
    // используется чтобы не дать забрать очки дважды за одну попытку и
    // чтобы отключить "×2 за рекламу", если очков меньше 10 (то есть
    // ничего не начислилось бы всё равно)
    let earnedPointsThisRound = 0;
    let pointsClaimedThisRound = false;

    window.addEventListener("towerbloxx:localgameover", (e) => {
      const { score, earnedPoints } = e.detail || {};
      earnedPointsThisRound = earnedPoints || 0;
      pointsClaimedThisRound = false;

      document.getElementById("scoreSummary").textContent = `Счёт: ${score}`;

      const takeBtn = document.getElementById("takePointsBtn");
      const doubleBtn = document.getElementById("doublePointsBtn");
      takeBtn.disabled = earnedPointsThisRound <= 0;
      doubleBtn.disabled = earnedPointsThisRound < 10;
      takeBtn.textContent = "Забрать 🏆";
      doubleBtn.textContent = "×2 за рекламу";
    });

    function claimPoints(messageType, btnClicked){
      if (pointsClaimedThisRound || earnedPointsThisRound <= 0) return;
      pointsClaimedThisRound = true;
      document.getElementById("takePointsBtn").disabled = true;
      document.getElementById("doublePointsBtn").disabled = true;
      btnClicked.textContent = messageType === "towerbloxx:doublePoints" ? "Смотрим рекламу…" : "Начисляем…";
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: messageType, amount: earnedPointsThisRound }, "*");
        }
      } catch (err) {}
    }

    document.getElementById("takePointsBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      claimPoints("towerbloxx:takePoints", e.currentTarget);
    });

    document.getElementById("doublePointsBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      claimPoints("towerbloxx:doublePoints", e.currentTarget);
    });

    document.getElementById("closeGameBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "towerbloxx:close" }, "*");
        }
      } catch (err) {}
    });
  </script>
</body>
</html>
